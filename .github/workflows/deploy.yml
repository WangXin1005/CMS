name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送后端镜像
        run: |
          docker build -t ghcr.io/wangxin1005/cms-backend:latest ./java-backend
          docker push ghcr.io/wangxin1005/cms-backend:latest

      - name: 构建并推送前端镜像
        run: |
          docker build -t ghcr.io/wangxin1005/cms-frontend:latest ./nuxt-test
          docker push ghcr.io/wangxin1005/cms-frontend:latest

      - name: 部署到服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          timeout: 600s
          command_timeout: 300s
          script: |
            set -e

            echo "===== 拉取代码 ====="
            cd /opt/CMS
            git fetch origin main
            git reset --hard origin/main

            echo "===== 生成 .env 配置 ====="
            cat > .env << 'ENVEOF'
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ENVEOF
            chmod 600 .env

            echo "===== 拉取镜像并重启 ====="
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d
            docker image prune -f

            echo "===== 部署完成 ====="
            docker compose -f docker-compose.deploy.yml ps
