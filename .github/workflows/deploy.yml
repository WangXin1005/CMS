# ============================================================
# CodeBlog CMS — 自动部署工作流
# 触发条件：推送到 main 分支
# 流程：构建镜像 → 推送 GHCR → SSH 远程部署
# ============================================================
name: 自动部署到服务器

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.env.example'

env:
  # GitHub Container Registry 镜像地址
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/codeblog-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/codeblog-frontend

jobs:
  # ==================== 构建 & 推送镜像 ====================
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GHCR（GitHub 容器仓库）
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建 & 推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./java-backend
          file: ./docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建 & 推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./nuxt-test
          file: ./docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== SSH 远程部署 ====================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # 仅构建成功后才部署
    if: success()

    steps:
      - name: 检出代码（需要 docker-compose.prod.yml）
        uses: actions/checkout@v4

      - name: SSH 部署到服务器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # 部署脚本
          script: |
            set -e

            # 切换到项目目录
            cd /opt/codeblog

            # 登录 GHCR（拉取私有镜像需要）
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 拉取最新镜像
            docker compose -f docker-compose.prod.yml pull

            # 滚动更新（先启动新容器，再停旧容器，减少停机时间）
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # 清理旧镜像（保留最近2个版本）
            docker image prune -af --filter "until=72h" 2>/dev/null || true

            # 登出 GHCR
            docker logout ghcr.io

            echo ""
            echo "============================================"
            echo "  部署完成！访问 http://${{ secrets.SSH_HOST }}"
            echo "============================================"
