name: �Զ����𵽷�����

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.env.example'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/wangxin1005/codeblog-backend
  FRONTEND_IMAGE: ghcr.io/wangxin1005/codeblog-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: �������
        uses: actions/checkout@v4

      - name: ���ð����� Docker �������
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors":["https://2eko5i08.mirror.aliyuncs.com"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sleep 3

      - name: ���� Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: ��¼ GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ���������ͺ�˾���
        timeout-minutes: 30
        uses: docker/build-push-action@v6
        with:
          context: ./java-backend
          file: ./docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: ����������ǰ�˾���
        timeout-minutes: 30
        uses: docker/build-push-action@v6
        with:
          context: ./nuxt-test
          file: ./docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    if: success()

    steps:
      - name: �������
        uses: actions/checkout@v4

      - name: SSH ���𵽷�����
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/codeblog
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -af --filter "until=72h" 2>/dev/null || true
            docker logout ghcr.io
            echo "������ɣ�"
