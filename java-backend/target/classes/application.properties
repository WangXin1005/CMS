server.port=8080
spring.application.name=nuxt-project-backend

# ===== MySQL =====
# 开发环境使用非 SSL 连接（本地 MySQL 通常未配置 SSL）
# 生产环境请通过环境变量覆盖 useSSL=true&requireSSL=true
spring.datasource.url=jdbc:mysql://localhost:13306/nuxt_test_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
# 默认密码为空，开发/生产环境通过 profile 或环境变量 SPRING_DATASOURCE_PASSWORD 注入
spring.datasource.password=Still0.0Memory
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
# 安全警告：生产环境必须通过 JWT_SECRET 环境变量设置密钥，不可使用默认值
# 默认密钥为空，开发/生产环境通过 profile 或环境变量 JWT_SECRET 注入
jwt.secret=CodeBlog-JWT-Secret-Key-2025-AtLeast-256-Bits!!
jwt.expiration=86400000

# ===== Swagger / SpringDoc =====
springdoc.api-docs.enabled=false
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.example.nuxtproject.controller
springdoc.show-actuator=false

# ===== File Upload =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# ===== Jackson =====
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=Asia/Shanghai

# ===== SpringDoc OpenAPI =====
springdoc.enable-spring-security=false
spring.autoconfigure.exclude=org.springdoc.core.configuration.SpringDocSecurityConfiguration
