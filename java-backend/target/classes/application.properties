server.port=8080
spring.application.name=nuxt-project-backend

# ===== MySQL =====
# 开发环境使用非 SSL 连接（本地 MySQL 通常未配置 SSL）
# 生产环境请通过环境变量覆盖 useSSL=true&requireSSL=true
# 数据库连接（开发环境 localhost:13306，Docker 环境通过 DB_HOST/DB_PORT 环境变量覆盖）
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13306}/nuxt_test_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
# ★ 生产环境必须通过环境变量 DB_USERNAME/DB_PASSWORD 设置强密码
# 开发环境使用默认值，仅限本地测试
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Still0.0Memory}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
# ★ 生产环境必须通过环境变量 JWT_SECRET 设置强随机密钥，否则存在严重安全风险
# 开发环境使用默认值，仅限本地测试
jwt.secret=${JWT_SECRET:CodeBlog-JWT-Secret-Key-2025-AtLeast-256-Bits!!}
jwt.expiration=86400000

# ===== Swagger / SpringDoc =====
springdoc.api-docs.enabled=false
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.example.nuxtproject.controller
springdoc.show-actuator=false

# ===== File Upload =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# 文件上传目录（生产环境通过环境变量 UPLOAD_DIR 覆盖为绝对路径，如 /data/codeblog/uploads）
# 开发环境默认为 ./uploads
app.upload.dir=${UPLOAD_DIR:./uploads}

# ===== Jackson =====
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=Asia/Shanghai

# ===== SpringDoc OpenAPI =====
springdoc.enable-spring-security=false
spring.autoconfigure.exclude=org.springdoc.core.configuration.SpringDocSecurityConfiguration
