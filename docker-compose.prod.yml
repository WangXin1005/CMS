services:

  mysql:
    image: mysql:8.0
    container_name: codeblog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=64M
      --innodb-log-buffer-size=8M
      --innodb-flush-log-at-trx-commit=2
      --max-connections=50
      --table-open-cache=128
      --performance-schema=OFF
      --skip-log-bin
    healthcheck:
      test: mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - codeblog-net
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 256M

  backend:
    image: ghcr.io/wangxin1005/codeblog-backend:latest
    container_name: codeblog-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS}
      APP_UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:8080/api/users/check
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - codeblog-net
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 256M

  frontend:
    image: ghcr.io/wangxin1005/codeblog-frontend:latest
    container_name: codeblog-frontend
    restart: unless-stopped
    environment:
      NUXT_API_PROXY_TARGET: http://backend:8080
      TZ: Asia/Shanghai
      NODE_OPTIONS: "--max-old-space-size=200"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:3000/
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - codeblog-net
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 200M

  nginx:
    image: nginx:alpine
    container_name: codeblog-nginx
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - codeblog-net
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  certbot:
    image: certbot/certbot:latest
    container_name: codeblog-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint:
      - sh
      - -c
      - "trap exit TERM; while :; do sleep 12h & wait $$!; certbot renew --webroot -w /var/www/certbot --quiet; done"
    networks:
      - codeblog-net
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

networks:
  codeblog-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local
  certbot_certs:
    driver: local
  certbot_www:
    driver: local
