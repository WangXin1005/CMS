services:
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=15
      - --innodb_buffer_pool_size=32M
      - --innodb_log_buffer_size=4M
      - --key_buffer_size=4M
      - --table_open_cache=32
      - --performance_schema=OFF
      - --skip-log-bin
      - --skip-name-resolve
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - blog-net
    deploy:
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 128M

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: blog-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m -Xss256k -XX:+ExitOnOutOfMemoryError"
      APP_UPLOAD_DIR: /app/uploads
      APP_CORS_ALLOWEDORIGINS: https://gocms.top,http://localhost:3000
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - blog-net
    deploy:
      resources:
        limits:
          memory: 448M
        reservations:
          memory: 192M

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: blog-frontend
    restart: always
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NODE_OPTIONS: "--max-old-space-size=128"
      HOST: "0.0.0.0"
      PORT: "3000"
    depends_on:
      - backend
    networks:
      - blog-net
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 96M

  nginx:
    image: nginx:alpine
    container_name: blog-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - blog-net
    deploy:
      resources:
        limits:
          memory: 48M
        reservations:
          memory: 16M

  webhook:
    build:
      context: .
      dockerfile: docker/Dockerfile.webhook
    container_name: blog-webhook
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      WEBHOOK_PORT: "9000"
      GITEE_REPO_OWNER: ${GITEE_REPO_OWNER}
      GITEE_REPO_NAME: ${GITEE_REPO_NAME}
      GIT_TOKEN: ${GIT_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy.sh:/app/deploy.sh:ro
      - /opt/codeblog:/opt/codeblog
    networks:
      - blog-net
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

networks:
  blog-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local