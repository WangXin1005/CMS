# ============================================================
# CodeBlog CMS — Docker Compose 编排（2核2G 服务器优化）
#
# 服务清单：
#   mysql    — MySQL 8.0（内存限制 384M）
#   backend  — Spring Boot 3（JVM 限制 256M）
#   frontend — Nuxt 4 SSR（Node 限制 200M）
#   nginx    — 反向代理（内存限制 64M）
#   webhook  — Gitee Webhook 自动部署（内存限制 128M）
#
# 总内存预算：~1.0-1.2 GB（含 OS 约 1.5-1.8 GB）
# 构建注意：后端和前端需逐序构建，避免同时构建导致 OOM
# ============================================================

services:

  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: codeblog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # 2GB 服务器 MySQL 优化参数
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=64M
      --innodb-log-buffer-size=8M
      --innodb-flush-log-at-trx-commit=2
      --max-connections=50
      --table-open-cache=128
      --performance-schema=OFF
      --skip-log-bin
    healthcheck:
      test: mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - codeblog-net
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 256M

  # ==================== Spring Boot 后端 ====================
  backend:
    build:
      context: ./java-backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: codeblog-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS}
      APP_UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:8080/api/users/check
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - codeblog-net
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 256M

  # ==================== Nuxt 前端 ====================
  frontend:
    build:
      context: ./nuxt-test
      dockerfile: ../docker/Dockerfile.frontend
    container_name: codeblog-frontend
    restart: unless-stopped
    environment:
      NUXT_API_PROXY_TARGET: http://backend:8080
      TZ: Asia/Shanghai
      NODE_OPTIONS: "--max-old-space-size=200"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:3000/
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - codeblog-net
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 200M

  # ==================== Nginx 反向代理 ====================
  nginx:
    image: nginx:alpine
    container_name: codeblog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - codeblog-net
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  # ==================== Gitee Webhook 自动部署 ====================
  webhook:
    build:
      context: .
      dockerfile: docker/Dockerfile.webhook
    container_name: codeblog-webhook
    restart: unless-stopped
    environment:
      WEBHOOK_PORT: ${WEBHOOK_PORT:-9000}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      WEBHOOK_BRANCH: ${WEBHOOK_BRANCH:-main}
    ports:
      - "9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/opt/codeblog
    working_dir: /opt/codeblog
    networks:
      - codeblog-net
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

networks:
  codeblog-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local
